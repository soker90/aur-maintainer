name: Release

#checkov:skip=CKV_GHA_7:Version input only selects release metadata; the released commit is always GITHUB_SHA.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release (for example, 1.0.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        id: validate-version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          TAG="v$VERSION"
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release commit
        id: verify-commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Releasing commit $GITHUB_SHA"

      - name: Create GitHub Release
        id: create-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate-version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: Move major tag
        id: move-major-tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate-version.outputs.tag }}
        run: |
          gh api \
            --method PATCH \
            "/repos/$GITHUB_REPOSITORY/git/refs/tags/v1" \
            -f "sha=$GITHUB_SHA" \
            -F "force=true"

      - name: Verify tags
        id: verify-tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate-version.outputs.tag }}
        run: |
          RELEASE_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          MAJOR_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/v1" --jq '.object.sha')"

          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$MAJOR_SHA" = "$GITHUB_SHA"

          echo "Release tag $TAG -> $RELEASE_SHA"
          echo "Major tag v1 -> $MAJOR_SHA"
