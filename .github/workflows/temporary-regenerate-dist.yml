name: Temporary bundle regeneration

on:
  push:
    branches:
      - feat/publish-merged-package-only

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:write
      - run: npm run package
      - name: Commit formatted sources and bundle
        run: |
          git add src/main.ts action.yml __tests__/main.test.ts dist/
          if git diff --cached --quiet; then
            echo "No formatting or bundle changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: format and rebuild action bundle"
          git push
