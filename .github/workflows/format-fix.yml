name: Format Fix

on:
  push:
    branches:
      - fix/github-tag-version-comparison

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/connectors.ts
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/connectors.ts
          git diff --cached --quiet || git commit -m "chore: format tag comparator"
          git push origin HEAD:fix/github-tag-version-comparison
