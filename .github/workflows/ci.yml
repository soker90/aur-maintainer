name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate Action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Format changed sources
        run: npx prettier --write src/discovery.ts src/main.ts __tests__/main.test.ts

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

      - name: Build dist/
        id: npm-package
        run: npm run package

      - name: Commit generated bundle (temporary)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/manual-package-maintenance-final'
        run: |
          if ! git diff --quiet -- dist/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/index.js src/discovery.ts src/main.ts __tests__/main.test.ts
            git commit -m "build: sync generated action bundle"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Export generated bundle for maintenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aur-maintainer-dist
          path: |
            dist/index.js
            src/types.ts
            src/config.ts
            src/discovery.ts
            src/main.ts
            src/update.ts
            action.yml
            __tests__/config.test.ts
            __tests__/discovery.test.ts
            __tests__/main.test.ts
            .github/workflows/ci.yml
          if-no-files-found: error
          retention-days: 1

      - name: Verify dist/
        id: verify-dist
        run: |
          if [ ! -d dist/ ]; then
            echo "Expected dist/ directory does not exist." >&2
            exit 1
          fi

          if ! git diff --quiet --exit-code -- dist/; then
            echo "dist/ is out of date. Run npm run package and commit the generated files." >&2
            git diff --stat -- dist/
            git diff --text -- dist/
            exit 1
          fi

      - name: Create fixture package
        id: fixture
        run: |
          mkdir -p .github/test-fixture/packages/example-bin
          cat > .github/test-fixture/packages/example-bin/PKGBUILD <<'EOF'
          pkgname=example-bin
          pkgver=1.0.0
          pkgrel=1
          arch=('x86_64')
          source=(
            'README.md::https://raw.githubusercontent.com/actions/checkout/main/README.md'
          )
          sha256sums=()
          package() {
            install -Dm644 "$srcdir/README.md" \
              "$pkgdir/usr/share/doc/example-bin/README.md"
          }
          EOF
          cat > .github/test-fixture/packages/example-bin/update.yml <<'EOF'
          connector: github-release
          config:
            repository: actions/checkout
          EOF
          cat > .github/test-fixture/.aur-maintainer.yml <<'EOF'
          packages:
            - .github/test-fixture/packages/example-bin
          EOF

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          config: .github/test-fixture/.aur-maintainer.yml

      - name: Verify Package Update
        id: verify-update
        run: |
          grep -Eq '^pkgver=[0-9]+' \
            .github/test-fixture/packages/example-bin/PKGBUILD
          test "$(grep '^pkgver=' \
            .github/test-fixture/packages/example-bin/PKGBUILD)" \
            != 'pkgver=1.0.0'
          test -s .github/test-fixture/packages/example-bin/.SRCINFO
          grep -Eq '^sha256sums=\(' \
            .github/test-fixture/packages/example-bin/PKGBUILD

      - name: Print Output
        id: output
        run: echo '${{ steps.test-action.outputs.packages }}'
