name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Dependencies
        id: npm-ci
        run: npm ci
      - name: Check Format
        id: npm-format-check
        run: npm run format:check
      - name: Lint
        id: npm-lint
        run: npm run lint
      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Create fixture package
        id: fixture
        run: |
          mkdir -p .github/test-fixture/packages/example-bin
          cat > .github/test-fixture/packages/example-bin/PKGBUILD <<'EOF'
          pkgname=example-bin
          pkgver=1.0.0
          pkgrel=1
          arch=('x86_64')
          source=(
            'README.md::https://raw.githubusercontent.com/actions/checkout/main/README.md'
          )
          sha256sums=()
          package() {
            install -Dm644 "$srcdir/README.md" \
              "$pkgdir/usr/share/doc/example-bin/README.md"
          }
          EOF
          cat > .github/test-fixture/packages/example-bin/update.yml <<'EOF'
          connector: github-release
          config:
            repository: actions/checkout
          EOF
          cat > .github/test-fixture/.aur-maintainer.yml <<'EOF'
          packages:
            - .github/test-fixture/packages/example-bin
          EOF
      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          config: .github/test-fixture/.aur-maintainer.yml
      - name: Verify Package Update
        id: verify-update
        run: |
          grep -Eq '^pkgver=[0-9]+' \
            .github/test-fixture/packages/example-bin/PKGBUILD
          test "$(grep '^pkgver=' \
            .github/test-fixture/packages/example-bin/PKGBUILD)" \
            != 'pkgver=1.0.0'
          test -s .github/test-fixture/packages/example-bin/.SRCINFO
          grep -Eq '^sha256sums=\(' \
            .github/test-fixture/packages/example-bin/PKGBUILD
      - name: Print Output
        id: output
        run: echo '${{ steps.test-action.outputs.packages }}'
