name: Temporary Build Feature Branch

on:
  push:
    branches:
      - feat/authenticate-github-api-requests

permissions:
  contents: write

jobs:
  build:
    if: github.actor == 'soker90'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Dependencies
        id: npm-ci
        run: npm ci
      - name: Build dist
        id: bundle
        run: npm run bundle
      - name: Commit dist
        id: commit
        run: |
          if git diff --quiet -- dist/; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          git commit -m 'chore: rebuild distribution'
          git push
