name: Prepare feature bundle

on:
  push:
    branches:
      - feat/npm-connector-version-assignments

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx prettier --write src/connectors.ts src/update.ts src/types.ts src/config.ts __tests__/connectors.test.ts __tests__/update.test.ts __tests__/config.test.ts docs/CONFIGURATION.md README.md
      - run: npm run lint
      - run: npm run ci-test
      - run: npm run package
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ src/connectors.ts src/update.ts src/types.ts src/config.ts __tests__/connectors.test.ts __tests__/update.test.ts __tests__/config.test.ts docs/CONFIGURATION.md README.md
          if git diff --cached --quiet; then
            echo "No formatting or bundle changes to commit."
            exit 0
          fi
          git commit -m "chore: format sources and regenerate action bundle"
          git push
