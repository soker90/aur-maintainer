# This workflow checks the statuses of cached dependencies used in this action
# with the help of the Licensed tool. See: https://github.com/licensee/licensed

name: Licensed

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  licensed:
    name: Update Licenses
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Setup Ruby
        id: setup-ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Setup Licensed
        id: setup-licensed
        uses: licensee/setup-licensed@v1.3.2
        with:
          version: 4.x
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Licenses
        id: update-licenses
        run: licensed cache

      - name: Check Licenses
        id: check-licenses
        run: licensed status

      - name: Create License Update PR
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet --exit-code; then
            echo "License cache is already up to date."
            exit 0
          fi

          BRANCH="update/licensed"
          git switch --create "$BRANCH"
          git config user.name "licensed-ci"
          git config user.email "licensed-ci@users.noreply.github.com"
          git add .
          git commit -m "chore: update license files"
          git push --set-upstream origin "$BRANCH"

          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "License update PR already exists."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "chore: update license files" \
            --body "Updates the Licensed dependency cache. CI must pass before this change is merged."
