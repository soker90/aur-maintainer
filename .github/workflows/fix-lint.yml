name: Fix Lint

on:
  push:
    branches:
      - fix/custom-connector-timeout

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Check ESLint
        run: npx eslint . --format json > eslint-report.json || true
      - name: Upload ESLint report
        uses: actions/upload-artifact@v7
        with:
          name: eslint-report
          path: eslint-report.json
      - name: Test
        run: npm test -- --json --outputFile=jest-report.json || true
      - name: Upload test report
        uses: actions/upload-artifact@v7
        with:
          name: jest-report
          path: jest-report.json
      - name: Build dist
        run: npm run bundle
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/
          git commit -m "style: apply ESLint fixes"
          git push
