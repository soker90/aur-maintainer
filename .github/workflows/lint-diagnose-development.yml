name: Diagnose lint development branch

on:
  push:
    branches:
      - feat/core-package-discovery

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Capture lint output
        run: |
          npm run lint > .github/lint-output.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/lint-output.txt
          git commit -m "chore: capture lint diagnostics" || true
          git push
