name: Refresh Bundled Action

on:
  push:
    branches:
      - fix/pr-concurrency-limit

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'build: update bundled action'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - name: Commit bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'build: update bundled action'
          git push
