name: Format Debug

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Format
        run: npx prettier --write src/validation.ts __tests__/validation.test.ts
      - name: Upload Formatted Sources
        uses: actions/upload-artifact@v6
        with:
          name: formatted-validation
          path: |
            src/validation.ts
            __tests__/validation.test.ts
