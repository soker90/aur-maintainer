name: Format Debug

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier --write README.md
      - uses: actions/upload-artifact@v6
        with:
          name: formatted-readme
          path: README.md
