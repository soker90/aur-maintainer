name: Format Debug

on:
  push:
    branches:
      - feat/update-package-metadata

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Format
        run: npx prettier --write src/metadata.ts __tests__/metadata.test.ts
      - name: Upload Formatted Sources
        uses: actions/upload-artifact@v6
        with:
          name: formatted-sources
          path: |
            src/metadata.ts
            __tests__/metadata.test.ts
