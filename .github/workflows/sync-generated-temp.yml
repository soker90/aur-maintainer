name: Temporary generated-action sync

on:
  push:
    branches:
      - fix/auto-merge-without-checks

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/pull-request.ts __tests__/pull-request.test.ts
      - run: npm run bundle
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pull-request.ts __tests__/pull-request.test.ts dist/index.js .github/workflows/sync-generated-temp.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: update generated action"
          git push
