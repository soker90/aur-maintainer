name: Temp Bundle

on:
  push:
    branches:
      - fix/github-tag-pagination

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Commit dist
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          git diff --cached --quiet || git commit -m "chore: update bundled action"
          git push
