name: AUR Maintainer
description: Automate Arch Linux AUR package maintenance
author: Eduardo Parra
branding:
  icon: package
  color: blue

inputs:
  config:
    description: Path to the optional repository configuration file
    required: false
    default: .aur-maintainer.yml
  github-token:
    description: GitHub token for API requests and update automation
    required: false
  update-branch:
    description: Prefix for generated package-specific update branches
    required: false
    default: update
  base-branch:
    description: >-
      Base branch that receives generated update pull requests
    required: false
    default: main
  auto-merge:
    description: Wait for checks and squash-merge the generated pull request
    required: false
    default: 'false'
  auto-merge-timeout:
    description: Maximum seconds to wait for pull request checks
    required: false
    default: '1800'
  aur-publish:
    description: Publish the updated package to the Arch User Repository
    required: false
    default: 'false'
  aur-publish-only:
    description: Publish current package state without upstream detection
    required: false
    default: 'false'
  aur-ssh-key:
    description: Private SSH key authorized for the AUR account
    required: false
  aur-known-hosts:
    description: Trusted known hosts entry for aur.archlinux.org
    required: false

outputs:
  packages:
    description: JSON with inspected packages and update results
  pull-request:
    description: URL of the first generated update pull request
  pull-requests:
    description: JSON array of generated update pull request URLs
  validation-failure-issue:
    description: URL of the validation failure issue

runs:
  using: node24
  main: dist/index.js
