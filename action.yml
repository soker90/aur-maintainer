name: AUR Maintainer
description: Automate the maintenance of Arch Linux AUR packages
author: Eduardo Parra

branding:
  icon: package
  color: blue

inputs:
  milliseconds:
    description: Template input retained temporarily while the Action bootstrap is completed
    required: false
    default: '1000'

outputs:
  time:
    description: Template output retained temporarily while the Action bootstrap is completed

runs:
  using: node24
  main: dist/index.js
