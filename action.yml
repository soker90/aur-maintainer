name: AUR Maintainer
description: >-
  Automate the maintenance of Arch Linux AUR packages
author: Eduardo Parra
branding:
  icon: package
  color: blue

inputs:
  config:
    description: >-
      Path to the optional repository configuration file
    required: false
    default: .aur-maintainer.yml
  github-token:
    description: >-
      GitHub token used for GitHub API requests and to create the update pull
      request
    required: false
  manual-package:
    description: >-
      Exact managed package name to update manually without running a connector
    required: false
  manual-version:
    description: >-
      Target pkgver for the selected manual package maintenance run
    required: false
  update-branch:
    description: >-
      Prefix used for generated package-specific update pull request branches
    required: false
    default: update
  base-branch:
    description: >-
      Branch that receives the generated update pull request
    required: false
    default: main
  auto-merge:
    description: >-
      Wait for pull request checks and squash-merge the generated pull request
    required: false
    default: 'false'
  auto-merge-timeout:
    description: >-
      Maximum number of seconds to wait for pull request checks before merging
    required: false
    default: '1800'
  aur-publish:
    description: >-
      Publish managed packages to the Arch User Repository
    required: false
    default: 'false'
  aur-publish-only:
    description: >-
      Publish a single package selected by its merged update branch without
      checking upstream updates
    required: false
    default: 'false'
  aur-publish-branch:
    description: >-
      Merged package update branch to publish, using the configured
      update-branch prefix (for example, update/example)
    required: false
  aur-ssh-key:
    description: >-
      Private SSH key authorized for the AUR account
    required: false
  aur-known-hosts:
    description: >-
      Known hosts entry for aur.archlinux.org
    required: false

outputs:
  packages:
    description: >-
      JSON array containing discovered packages and detected update candidates
  pull-request:
    description: >-
      URL of the first generated update pull request, when one is created
  pull-requests:
    description: >-
      JSON array containing URLs of generated package-specific update pull
      requests
  validation-failure-issue:
    description: >-
      URL of the issue created when package validation fails

runs:
  using: node24
  main: dist/index.js
