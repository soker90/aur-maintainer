name: AUR Maintainer
description: >-
  Automate the maintenance of Arch Linux AUR packages
author: Eduardo Parra
branding:
  icon: package
  color: blue

inputs:
  config:
    description: >-
      Path to the optional repository configuration file
    required: false
    default: .aur-maintainer.yml

outputs:
  packages:
    description: >-
      JSON array containing the discovered package names

runs:
  using: node24
  main: dist/index.js
