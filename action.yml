name: AUR Maintainer
description: >-
  Automate the maintenance of Arch Linux AUR packages
author: Eduardo Parra
branding:
  icon: package
  color: blue

inputs:
  config:
    description: >-
      Path to the optional repository configuration file
    required: false
    default: .aur-maintainer.yml
  github-token:
    description: >-
      GitHub token used for GitHub API requests and to create the update pull
      request
    required: false
  update-branch:
    description: >-
      Branch used for the generated update pull request
    required: false
    default: aur-maintainer/updates
  base-branch:
    description: >-
      Branch that receives the generated update pull request
    required: false
    default: main
  auto-merge:
    description: >-
      Enable GitHub auto-merge for the generated update pull request
    required: false
    default: 'false'
  aur-publish:
    description: >-
      Publish managed packages to the Arch User Repository
    required: false
    default: 'false'
  aur-ssh-key:
    description: >-
      Private SSH key authorized for the AUR account
    required: false
  aur-known-hosts:
    description: >-
      Known hosts entry for aur.archlinux.org
    required: false

outputs:
  packages:
    description: >-
      JSON array containing discovered packages and detected update candidates
  pull-request:
    description: >-
      URL of the generated update pull request, when one is created

runs:
  using: node24
  main: dist/index.js
